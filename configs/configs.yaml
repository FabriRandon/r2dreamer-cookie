defaults:
  - env: dmc_vision
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
# Continue from the checkpoint in logdir when there is one.
resume: True
device: 'cuda:0'

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 5e5
  # Sequences per batch drawn around a rewarded step instead of uniformly.
  # Helps the reward model when rewards are too sparse to show up otherwise.
  reward_slices: 0
  device: ${device}
  storage_device: ${device}

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}
  save_every: 1e4
  # The replay buffer is most of the checkpoint on disk. Dropping it makes
  # a resumed run start collecting data from scratch.
  save_buffer: True
  # Steps between saves of the replay buffer. Each one writes the whole
  # buffer, so a big buffer is better saved less often than the agent. A run
  # resumed after a crash loses the data collected since the last one.
  save_buffer_every: 1e4
  # Stop and save at this step, short of trainer.steps, to go on later.
  stop_at: null
  # Stop and save after this many hours of this session (null: no limit),
  # wherever the run is. Run the same command again to continue.
  max_hours: null
  # Collect data with uniformly random actions instead of the actor, to
  # study the world model learned from undirected experience.
  random_policy: False
  # Share of the collected episodes played by each source (normalised, so only
  # the proportions matter). Each episode is assigned to one source when it
  # starts: "actor" is Dreamer's own policy, "random" picks uniformly random
  # actions, and "expert" is the hand-written perfect policy of the cookie
  # task (envs/expert.py). Evaluation always uses the actor.
  # With none set (all 0) the actor plays every episode. Examples:
  #   trainer.data_mix.expert=1                            expert data only
  #   trainer.data_mix.actor=2 trainer.data_mix.random=1   two thirds actor, one third random
  data_mix:
    actor: 0.0
    random: 0.0
    expert: 0.0

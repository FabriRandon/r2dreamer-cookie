task: cookie_partial
steps: 1.01e6
env_num: 1
eval_episode_num: 10
action_repeat: 1
train_ratio: 512
# MiniGrid's own default for this grid: 4 * height * width.
time_limit: 2088
# Only turn and move; moving into the button presses it.
press_on_move: True
# Cells per side of the view the hand-written expert (trainer.data_mix.expert) decides
# from: 5 is the original expert, 3 the one for an agent that only sees 3x3.
expert_view: 5
# Solid obstacles per room (the button's and the two where cookies appear), of a random shape and
# colour and in a random free place, drawn again every episode (envs/obstacles.py). 0: none.
obstacles: 0



seed: ${seed}
device: ${device}

size: [64, 64]
encoder:
  mlp_keys: '$^'
  cnn_keys: 'image'
decoder:
  mlp_keys: '$^'
  cnn_keys: 'image'


